[project]
name = "supply-chain-guardian"
version = "0.1.0"
description = "Evidence-backed software supply chain inventory"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cyclonedx-bom==9.0.0",
    "networkx==3.7",
    "packageurl-python==0.17.6",
    "pydantic==2.14.4",
    "pyvis==0.3.2",
    "pyyaml==6.0.4",
    "spdx-tools==0.8.5",
    "typer==0.29.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]
