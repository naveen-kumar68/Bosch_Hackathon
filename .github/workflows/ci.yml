name: Checkpoint 1 quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.8"
      - name: Install pinned Rust toolchain for metadata-only tests
        run: rustup toolchain install 1.91.1 --profile minimal
      - name: Select Rust toolchain
        run: rustup default 1.91.1
      - run: uv sync --locked
      - run: uv run ruff check guardian tests
      - run: uv run ruff format --check guardian tests
      - run: uv run pytest -q
